<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CactusCrawler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas für Partikeleffekte -->
  <canvas id="particle-canvas"></canvas>

  <!-- HAUPTMENÜ OVERLAY -->
  <div id="main-menu">
    <h1 class="game-title">🌵 CactusCrawler 🌵</h1>
    <p class="subtitle">Erkunde das Wüstendungeon und entfessle die Elemente!</p>
    <button id="start-game-btn" class="btn-action btn-gold btn-large">Spiel Starten ⚔️</button>
  </div>

  <div id="game-container" class="hidden">
    
    <!-- DUNGEON-BEREICH -->
    <section id="dungeon-zone">
      <div class="header-info">
        <h2>Dungeon Ebene <span id="floor">1</span></h2>
        <span id="monster-type-badge" class="badge">Ebene 1</span>
      </div>
      
      <div id="monster-card">
        <div id="monster-avatar">
          <img id="monster-img" src="assets/snail.png" alt="Monster" onerror="this.src='https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f40c.png'">
        </div>
        <div id="monster-name">Wüsten-Schnecke</div>
        <div class="hp-bar-container">
          <div id="monster-hp-bar"></div>
        </div>
        <p>HP: <span id="monster-hp">20</span> / <span id="monster-max-hp">20</span></p>
        <button id="attack-btn" class="btn-action btn-red">Monster Angreifen ⚔️</button>
      </div>
    </section>

    <!-- KAKTUS / CLICKER-BEREICH -->
    <section id="clicker-zone">
      <div id="stats">
        <div class="stat-box">💧 <span id="water">0</span></div>
        <div class="stat-box">🪙 <span id="gold">0</span></div>
        <div class="stat-box">🌵 PWR <span id="power">1</span></div>
      </div>

      <div id="click-area">
        <img id="cactus-clicker" class="cactus-img" src="assets/cactus.png" alt="Kaktus" onerror="this.src='https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f335.png'">
        <button id="ability-btn" class="btn-action btn-ability">Fähigkeit nutzen ✨</button>
      </div>

      <!-- TABS SYSTEM -->
      <div class="tab-buttons">
        <button id="tab-upgrades-btn" class="tab-btn active">Upgrades</button>
        <button id="tab-cacti-btn" class="tab-btn">🌵 Kakteen</button>
        <button id="tab-gamble-btn" class="tab-btn">🎰 Casino</button>
      </div>

      <div id="tab-upgrades" class="tab-content active">
        <button id="upgrade-water-btn" class="btn-action">Besserer Gießer (+1 💧/Klick)<br>Kosten: <span id="cost-water">10</span> 💧</button>
        <button id="upgrade-power-btn" class="btn-action">Stacheln schärfen (+1 PWR)<br>Kosten: <span id="cost-power">15</span> 🪙</button>
      </div>

      <div id="tab-cacti" class="tab-content">
        <div class="cactus-grid">
          <button class="cactus-select-btn active" data-cactus="normal">🌵 Normal</button>
          <button class="cactus-select-btn" data-cactus="fire">🔥 Feuer</button>
          <button class="cactus-select-btn" data-cactus="ice">❄️ Eis</button>
          <button class="cactus-select-btn" data-cactus="electro">⚡ Elektro</button>
        </div>
      </div>

      <div id="tab-gamble" class="tab-content">
        <div class="gamble-box">
          <h4>Kaktus-Slots (50 🪙)</h4>
          <div id="slot-display">🌵 | 🌵 | 🌵</div>
          <button id="spin-slot-btn" class="btn-action btn-gold">Drehen!</button>
        </div>
        <div class="gamble-box">
          <h4>Mystery-Kiste (100 💧)</h4>
          <button id="open-box-btn" class="btn-action btn-purple">Kiste öffnen 📦</button>
        </div>
      </div>
    </section>

    <!-- ZUFALLSEVENT -->
    <div id="random-event-item" class="hidden">🌵✨</div>

  </div>
  <script src="script.js"></script>
</body>
</html>
